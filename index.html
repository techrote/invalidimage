<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Invalid Image</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <main class="shell">
    <header class="mast">
      <div>
        <p class="eyebrow">deterministic destructive renderer</p>
        <h1>Invalid Image</h1>
      </div>
      <div id="status" class="status">booting</div>
    </header>
    <section class="workspace">
      <div class="viewport">
        <canvas id="view" width="384" height="384" aria-label="Rendered image"></canvas>
        <div class="drop-note">drop image / click to load</div>
        <input id="file" type="file" accept="image/*" hidden>
      </div>
      <aside class="panel">
        <label>Seed <input id="seed" type="number" value="5501" step="1"></label>
        <label>Autonomy <input id="autonomy" type="range" min="0" max="1" value="0.62" step="0.01"><output>0.62</output></label>
        <label>Displacement <input id="displacement" type="range" min="0" max="1" value="0.48" step="0.01"><output>0.48</output></label>
        <label>Memory <input id="memory" type="range" min="0" max="1" value="0.73" step="0.01"><output>0.73</output></label>
        <label>Pressure <input id="pressure" type="range" min="0" max="1" value="0.37" step="0.01"><output>0.37</output></label>
        <label>Texture Motion <input id="textureMotion" type="range" min="0" max="2" value="1" step="0.01"><output>1.00</output></label>
        <label>Texture Complexity <input id="textureComplexity" type="range" min="0" max="1" value="0.50" step="0.01"><output>0.50</output></label>
        <label>Swirl <input id="swirl" type="range" min="0" max="1.5" value="0.682" step="0.001"><output>0.68</output></label>
        <label>Local Warp <input id="localWarp" type="range" min="0" max="1" value="0.48" step="0.01"><output>0.48</output></label>
        <label>Directions <select id="directions"><option>4</option><option selected>8</option><option>16</option></select></label>
        <label>Macro Mode <select id="macroMode"><option value="legacy-auto" selected>legacy auto</option><option value="manual">manual</option></select></label>
        <label>Global Amount <input id="globalAmount" type="range" min="0" max="1" value="1" step="0.01"><output>1.00</output></label>
        <label>Skew Pan <input id="skewPan" type="range" min="-1" max="1" value="0" step="0.01"><output>0.00</output></label>
        <label>Feedback X <input id="feedbackX" type="range" min="-8" max="8" value="0" step="1"><output>0.00</output></label>
        <label>Feedback Y <input id="feedbackY" type="range" min="-4" max="4" value="0" step="1"><output>0.00</output></label>
        <label>Address Amount <input id="addressAmount" type="range" min="0" max="1" value="0.37" step="0.01"><output>0.37</output></label>
        <label>Stride Pan <input id="stridePan" type="range" min="-1" max="1" value="0.46" step="0.01"><output>0.46</output></label>
        <label>Address Identity <input id="xorIdentity" type="range" min="0" max="255" value="137" step="1"><output>137.00</output></label>
        <label class="check"><input id="addressing" type="checkbox" checked> address drift</label>
        <label class="check"><input id="adaptive" type="checkbox" checked> adaptive routing</label>
        <label class="check"><input id="calm" type="checkbox" checked> calm motion</label>
        <div class="buttons">
          <button id="reset">reset</button>
          <button id="pause">pause</button>
          <button id="step">step</button>
          <button id="mutate">mutate</button>
        </div>
        <dl class="readout">
          <div><dt>frame</dt><dd id="frame">0</dd></div>
          <div><dt>route</dt><dd id="route">-</dd></div>
          <div><dt>energy</dt><dd id="energy">0</dd></div>
          <div><dt>latch</dt><dd id="latch">0</dd></div>
        </dl>
      </aside>
    </section>
  </main>
  <script>
    (() => {
      const status = document.querySelector('#status');
      const fail = (message) => {
        if (!window.__invalidImageBooted && status) status.textContent = message;
      };

      window.addEventListener('error', (event) => {
        fail('startup error — ' + (event.message || 'check browser console'));
      });

      window.setTimeout(() => {
        if (window.__invalidImageBooted) return;
        if (location.protocol === 'file:') {
          fail('cannot run from file:// — use 0Play.cmd or npm run dev');
        } else {
          fail('startup failed — check browser console');
        }
      }, 1200);
    })();
  </script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
